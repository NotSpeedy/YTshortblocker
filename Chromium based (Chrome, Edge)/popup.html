<!DOCTYPE html>
<html>
<head>
<style>
body { width: 280px; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #1a1a2e; color: #e0e0e0; margin: 0; }
h2 { margin: 0 0 12px; font-size: 16px; color: #ff4444; display: flex; align-items: center; gap: 6px; }
p { margin: 0 0 6px; font-size: 12px; line-height: 1.5; color: #999; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; padding: 12px; background: #16213e; border-radius: 10px; }
.toggle-label { font-size: 13px; font-weight: 600; }
.switch { position: relative; width: 48px; height: 26px; cursor: pointer; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; inset: 0; background: #444; border-radius: 26px; transition: 0.3s; }
.slider::before { content: ''; position: absolute; height: 20px; width: 20px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: 0.3s; }
input:checked + .slider { background: #4caf50; }
input:checked + .slider::before { transform: translateX(22px); }
.status { font-size: 12px; margin-top: 12px; padding: 8px 12px; border-radius: 8px; text-align: center; font-weight: 600; transition: 0.3s; }
.status.active { background: rgba(76,175,80,0.15); color: #4caf50; }
.status.inactive { background: rgba(255,68,68,0.15); color: #ff4444; }
</style>
</head>
<body>
<h2>🚫 Shorts Blocker</h2>
<p>Block YouTube Shorts from appearing on all YouTube pages.</p>

<div class="toggle-row">
  <span class="toggle-label" id="label">Enabled</span>
  <label class="switch">
    <input type="checkbox" id="toggle" checked>
    <span class="slider"></span>
  </label>
</div>

<div class="status active" id="status">✓ Shorts are being blocked</div>

<script src="popup.js"></script>
</body>
</html>
